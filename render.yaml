# Render Blueprint — 대시보드에서 New → Blueprint 로 이 저장소를 연결하면 그대로 뜬다.
# 프론트(apps/web)는 Vercel 에 배포한다 (Root Directory 를 apps/web 으로 지정).
services:
  # ── whale-dad NestJS 서버 ──
  - type: web
    name: whale-dad-server
    runtime: docker
    region: singapore
    plan: starter
    branch: main
    autoDeploy: true
    dockerfilePath: ./Dockerfile.render
    # 컨테이너는 기동 시 prisma migrate deploy 를 먼저 돌린다.
    healthCheckPath: /api/health
    buildFilter:
      paths:
        - apps/server/**
        - packages/shared/**
        - Dockerfile.render
        - render.yaml
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
    envVars:
      # Dockerfile EXPOSE / main.ts 의 기본 PORT 와 반드시 일치
      - key: PORT
        value: "20000"
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Seoul

      # ── CORS ──
      # Vercel 도메인 (콤마로 여러 개 가능).
      # 여기 값이 안 맞으면 프론트 요청이 CORS 로 막히고 쿠키도 안 붙는다.
      # blueprint 의 value 는 대시보드 값을 덮어쓰므로 도메인이 바뀌면 여기도 같이 고칠 것.
      - key: CORS_ORIGINS
        value: "https://whale-dad-web.vercel.app"

      # ── DB (필수) ──
      # Supabase Dashboard > Connect > Session pooler 의 문자열을 두 값에 똑같이 넣는다.
      #   Direct connection(db.<ref>.supabase.co)은 IPv6 전용이라 Render 에서 붙지 않는다.
      #   Transaction pooler(6543)는 필요 없다 — driver adapter 라 URL 파라미터가 무시되고,
      #   풀 크기는 DATABASE_POOL_MAX 로 정한다.
      - key: DATABASE_URL
        sync: false
      # prisma migrate deploy 가 쓰는 값
      - key: DIRECT_URL
        sync: false
      - key: DATABASE_POOL_MAX
        value: "10"

      # ── 인증 (필수) ──
      # Render 가 배포 시 랜덤 값을 만들어 넣는다. 값이 바뀌면 기존 로그인은 모두 풀린다.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 30d

      # ── Supabase Storage (선택) ──
      # 비워두면 Storage 기능만 꺼지고 서버는 정상 기동한다.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: whale-dad
